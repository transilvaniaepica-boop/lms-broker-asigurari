databases:
  # 1. Baza de Date PostgreSQL Managed pe Render
  - name: asig-lms-db
    databaseName: asiglms
    user: asiglms_admin
    plan: free # sau starter
    ipAllowList: []

services:
  # 2. Serviciul Web Node.js Full-Stack (Express + Socket.io + Frontend Vite integrat)
  - type: web
    name: asig-lms-app
    env: node
    plan: free # sau starter
    buildCommand: npm run build
    startCommand: node server/db/migrate.js && node server/db/seed.js && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: asig-lms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: on-boarding@resend.dev
      - key: APP_URL
        sync: false
